{% load static %}
{# Artwork detail modal - shown when user clicks an artwork card #}
<div id="artwork-detail-modal" class="fixed inset-0 z-50 hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="artwork-modal-title">
  <div class="fixed inset-0 bg-black/50" id="artwork-detail-backdrop"></div>
  <div id="artwork-detail-overlay" class="fixed inset-0 flex items-center justify-center p-4">
    <div class="relative w-full max-w-3xl max-h-[92dvh] overflow-y-auto rounded-2xl shadow-2xl" style="background: var(--theme-bg-card); border: 1px solid var(--theme-border);">
      <button type="button" id="artwork-detail-close" class="modal-close" aria-label="Close">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>

      <div style="display:grid; grid-template-columns: 1fr 1fr;" id="modal-grid">
        {# Left: image carousel #}
        <div id="artwork-modal-carousel" class="relative overflow-hidden touch-pan-y" style="background: var(--theme-bg); min-height: 260px; border-radius: 1.25rem 0 0 1.25rem;">
          <div id="artwork-carousel-track" class="flex transition-transform duration-300 ease-out" style="min-height: 260px;"></div>
          <button type="button" id="artwork-carousel-prev" class="absolute left-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full flex items-center justify-center" style="background:rgba(0,0,0,0.4);color:#fff;" aria-label="Previous image">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
          </button>
          <button type="button" id="artwork-carousel-next" class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full flex items-center justify-center" style="background:rgba(0,0,0,0.4);color:#fff;" aria-label="Next image">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          </button>
          <div id="artwork-carousel-dots" class="absolute bottom-2 left-0 right-0 flex justify-center gap-1.5"></div>
        </div>

        {# Right: details #}
        <div class="modal-body">
          <p class="modal-eyebrow">Original Work</p>
          <h2 id="artwork-modal-title" class="modal-title"></h2>
          <p id="artwork-modal-artist" class="modal-artist"></p>

          {# Trust signals #}
          <div class="modal-trust">
            <span class="modal-trust-item">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
              Secure checkout
            </span>
            <span class="modal-trust-item">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
              Made to order
            </span>
            <span class="modal-trust-item">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
              Free shipping over $75
            </span>
          </div>

          <p id="artwork-modal-description" class="modal-desc"></p>

          <div>
            <p class="modal-product-label">Format / Size</p>
            <select id="artwork-modal-product-select" class="modal-product-select">
              <option value="">Choose an option…</option>
            </select>
            <p class="modal-hint">Select a format to see pricing and add to cart.</p>
          </div>

          <p id="artwork-modal-price" class="modal-price"></p>

          <button type="button" id="artwork-modal-add-cart" class="modal-add-cart-btn" disabled>
            Add to cart
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
<style>
#modal-grid { display: grid; grid-template-columns: 1fr 1fr; }
@media (max-width: 640px) { #modal-grid { grid-template-columns: 1fr; } #artwork-modal-carousel { border-radius: 1.25rem 1.25rem 0 0 !important; min-height: 200px !important; } }
#artwork-carousel-track .carousel-slide { flex: 0 0 100%; width: 100%; }
#artwork-carousel-track .carousel-slide img { width: 100%; height: 340px; object-fit: cover; display: block; }
@media (max-width: 640px) { #artwork-carousel-track .carousel-slide img { height: 220px; } }
#artwork-carousel-dots .carousel-dot { width: 6px; height: 6px; border-radius: 50%; transition: opacity 0.2s; cursor: pointer; }
</style>
<script>
(function() {
  var modal = document.getElementById('artwork-detail-modal');
  var closeBtn = document.getElementById('artwork-detail-close');
  var backdrop = document.getElementById('artwork-detail-backdrop');
  var titleEl = document.getElementById('artwork-modal-title');
  var trackEl = document.getElementById('artwork-carousel-track');
  var dotsEl = document.getElementById('artwork-carousel-dots');
  var prevBtn = document.getElementById('artwork-carousel-prev');
  var nextBtn = document.getElementById('artwork-carousel-next');
  var artistEl = document.getElementById('artwork-modal-artist');
  var descEl = document.getElementById('artwork-modal-description');
  var selectEl = document.getElementById('artwork-modal-product-select');
  var priceEl = document.getElementById('artwork-modal-price');
  var addCartBtn = document.getElementById('artwork-modal-add-cart');
  var cartAddUrl = '{% url "cart_add" 0 %}'.replace('/0/', '/');
  var currentArtworkId = null;
  var carouselSlides = [];
  var carouselIndex = 0;
  var touchStartX = 0;

  function openModal() {
    modal.classList.remove('hidden');
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    closeBtn && closeBtn.focus();
  }
  function closeModal() {
    modal.classList.add('hidden');
    modal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  function goToSlide(index) {
    if (!carouselSlides.length) return;
    carouselIndex = Math.max(0, Math.min(index, carouselSlides.length - 1));
    trackEl.style.transform = 'translateX(-' + (carouselIndex * 100) + '%)';
    dotsEl.querySelectorAll('.carousel-dot').forEach(function(d, i) {
      d.style.background = i === carouselIndex ? 'var(--theme-accent)' : 'rgba(255,255,255,0.55)';
    });
  }

  function populateCarousel(slides, title) {
    carouselSlides = slides;
    carouselIndex = 0;
    trackEl.innerHTML = '';
    dotsEl.innerHTML = '';
    var show = slides.length > 1;
    prevBtn.style.display = show ? 'flex' : 'none';
    nextBtn.style.display = show ? 'flex' : 'none';
    if (!slides.length) {
      trackEl.innerHTML = '<div class="carousel-slide flex items-center justify-center" style="min-height:260px;background:var(--theme-border);"><span style="color:var(--theme-text-muted);">No image</span></div>';
      return;
    }
    slides.forEach(function(s, i) {
      var slide = document.createElement('div');
      slide.className = 'carousel-slide';
      slide.innerHTML = s.url ? '<img src="' + s.url + '" alt="' + (title || '') + '">' : '<div style="min-height:260px;background:var(--theme-border);display:flex;align-items:center;justify-content:center;"><span style="color:var(--theme-text-muted);">No image</span></div>';
      trackEl.appendChild(slide);
      if (slides.length > 1) {
        var dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'carousel-dot';
        dot.style.background = i === 0 ? 'var(--theme-accent)' : 'rgba(255,255,255,0.55)';
        dot.dataset.index = String(i);
        dot.setAttribute('aria-label', 'Image ' + (i + 1));
        dotsEl.appendChild(dot);
      }
    });
  }

  function populateModal(card) {
    currentArtworkId = card.getAttribute('data-artwork-id');
    var title = card.getAttribute('data-title') || '';
    var desc = card.getAttribute('data-description') || '';
    var artist = card.getAttribute('data-artist') || '';
    var imageUrl = card.getAttribute('data-image-url') || '';
    var basePrice = card.getAttribute('data-price') || '0';
    var extraImages = [];
    try { extraImages = JSON.parse(card.getAttribute('data-extra-images') || '[]'); } catch(e) {}
    var products = [];
    try { products = JSON.parse(card.getAttribute('data-products') || '[]'); } catch(e) {}

    titleEl.textContent = title;
    artistEl.textContent = artist ? 'by ' + artist : '';
    descEl.textContent = desc;
    descEl.style.display = desc ? '' : 'none';

    var slides = [];
    if (imageUrl) slides.push({ url: imageUrl });
    extraImages.forEach(function(s) { if (s.url) slides.push(s); });
    populateCarousel(slides, title);
    goToSlide(0);

    selectEl.innerHTML = '<option value="">Choose an option…</option>';
    if (!products.length) {
      selectEl.innerHTML += '<option value="0">Standard print — $' + basePrice + '</option>';
    } else {
      products.forEach(function(p) {
        selectEl.innerHTML += '<option value="' + p.id + '">' + p.name + ' — $' + p.price + '</option>';
      });
    }
    priceEl.textContent = '';
    addCartBtn.disabled = true;
    addCartBtn.dataset.artworkId = currentArtworkId;
    addCartBtn.dataset.productId = '';
  }

  prevBtn.addEventListener('click', function() { goToSlide(carouselIndex - 1); });
  nextBtn.addEventListener('click', function() { goToSlide(carouselIndex + 1); });
  dotsEl.addEventListener('click', function(e) {
    var dot = e.target.closest('.carousel-dot');
    if (dot) goToSlide(parseInt(dot.dataset.index, 10));
  });
  trackEl.addEventListener('touchstart', function(e) { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
  trackEl.addEventListener('touchend', function(e) {
    var diff = touchStartX - e.changedTouches[0].screenX;
    if (Math.abs(diff) > 48) goToSlide(carouselIndex + (diff > 0 ? 1 : -1));
  }, { passive: true });

  selectEl.addEventListener('change', function() {
    var val = this.value;
    if (!val) { priceEl.textContent = ''; addCartBtn.disabled = true; return; }
    var text = this.options[this.selectedIndex].text;
    var priceMatch = text.match(/\$[\d.]+/);
    priceEl.textContent = priceMatch ? priceMatch[0] : '';
    addCartBtn.disabled = false;
    addCartBtn.dataset.productId = val;
  });

  addCartBtn.addEventListener('click', function() {
    var pid = addCartBtn.dataset.productId;
    var aid = addCartBtn.dataset.artworkId;
    if (!pid || !aid) return;
    var url = cartAddUrl + aid + '/?product_id=' + pid;
    window.location.href = url;
  });

  document.addEventListener('click', function(e) {
    var card = e.target.closest('.artwork-card');
    if (card && !e.target.closest('.quick-view-btn')) {
      e.preventDefault();
      populateModal(card);
      openModal();
      return;
    }
    var qv = e.target.closest('.quick-view-btn');
    if (qv) {
      e.preventDefault();
      e.stopPropagation();
      var parentCard = qv.closest('.artwork-card');
      if (parentCard) { populateModal(parentCard); openModal(); }
    }
  });

  closeBtn && closeBtn.addEventListener('click', closeModal);
  backdrop && backdrop.addEventListener('click', closeModal);
  document.getElementById('artwork-detail-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
  document.addEventListener('keydown', function(e) {
    if (modal.classList.contains('hidden')) return;
    if (e.key === 'Escape') closeModal();
    if (e.key === 'ArrowLeft') goToSlide(carouselIndex - 1);
    if (e.key === 'ArrowRight') goToSlide(carouselIndex + 1);
  });
})();
</script>
