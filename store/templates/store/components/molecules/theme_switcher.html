{# Molecule: Theme dropdown switcher #}
<div class="theme-switcher relative">
  <button
    type="button"
    id="theme-toggle"
    class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm font-medium transition-colors"
    style="background: var(--theme-border); color: var(--theme-text);"
    aria-expanded="false"
    aria-haspopup="listbox"
    aria-label="Choose theme"
  >
    <span class="w-3 h-3 rounded-full shrink-0 theme-preview-dot" style="background: var(--theme-accent);"></span>
    <span style="font-size: 0.8rem;">Theme</span>
    <svg class="w-3 h-3 transition-transform theme-chevron opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
    </svg>
  </button>
  <div
    id="theme-menu"
    class="theme-menu absolute bottom-full left-0 mb-2 w-52 rounded-xl shadow-xl py-1.5 hidden"
    style="background: var(--theme-bg-card); border: 1px solid var(--theme-border);"
  >
    <button type="button" data-theme="cute-beige"    class="theme-option w-full text-left px-3.5 py-2 text-sm flex items-center gap-2.5 hover:opacity-80" style="color: var(--theme-text);"><span class="w-3 h-3 rounded-full shrink-0" style="background:#b08a5a"></span>Warm Beige</button>
    <button type="button" data-theme="artisan-stone" class="theme-option w-full text-left px-3.5 py-2 text-sm flex items-center gap-2.5 hover:opacity-80" style="color: var(--theme-text);"><span class="w-3 h-3 rounded-full shrink-0" style="background:#8b6945"></span>Artisan Stone</button>
    <div style="height:1px; background: var(--theme-border); margin: 0.375rem 0.875rem;"></div>
    <button type="button" data-theme="lavender"      class="theme-option w-full text-left px-3.5 py-2 text-sm flex items-center gap-2.5 hover:opacity-80" style="color: var(--theme-text);"><span class="w-3 h-3 rounded-full shrink-0" style="background:#9b8bb8"></span>Lavender</button>
    <button type="button" data-theme="baby-blue"     class="theme-option w-full text-left px-3.5 py-2 text-sm flex items-center gap-2.5 hover:opacity-80" style="color: var(--theme-text);"><span class="w-3 h-3 rounded-full shrink-0" style="background:#7ba3c9"></span>Baby Blue</button>
    <button type="button" data-theme="peach-pink"    class="theme-option w-full text-left px-3.5 py-2 text-sm flex items-center gap-2.5 hover:opacity-80" style="color: var(--theme-text);"><span class="w-3 h-3 rounded-full shrink-0" style="background:#e8a598"></span>Peach Pink</button>
    <button type="button" data-theme="mint-green"    class="theme-option w-full text-left px-3.5 py-2 text-sm flex items-center gap-2.5 hover:opacity-80" style="color: var(--theme-text);"><span class="w-3 h-3 rounded-full shrink-0" style="background:#6fb996"></span>Mint Green</button>
    <button type="button" data-theme="slate-gray"    class="theme-option w-full text-left px-3.5 py-2 text-sm flex items-center gap-2.5 hover:opacity-80" style="color: var(--theme-text);"><span class="w-3 h-3 rounded-full shrink-0" style="background:#64748b"></span>Slate Gray</button>
    <button type="button" data-theme="coral-red"     class="theme-option w-full text-left px-3.5 py-2 text-sm flex items-center gap-2.5 hover:opacity-80" style="color: var(--theme-text);"><span class="w-3 h-3 rounded-full shrink-0" style="background:#e07a6b"></span>Coral Red</button>
  </div>
</div>
<script>
(function() {
  var STORAGE_KEY = 'artist-store-theme';
  var COLORS = {
    'cute-beige':    '#b08a5a',
    'artisan-stone': '#8b6945',
    'lavender':      '#9b8bb8',
    'baby-blue':     '#7ba3c9',
    'peach-pink':    '#e8a598',
    'slate-gray':    '#64748b',
    'mint-green':    '#6fb996',
    'coral-red':     '#e07a6b',
  };
  var toggle = document.getElementById('theme-toggle');
  var menu   = document.getElementById('theme-menu');
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem(STORAGE_KEY, theme);
    var dot = document.querySelector('.theme-preview-dot');
    if (dot) { dot.style.background = COLORS[theme] || COLORS['cute-beige']; }
    menu.classList.add('hidden');
    toggle.setAttribute('aria-expanded', 'false');
  }
  function init() {
    var saved = localStorage.getItem(STORAGE_KEY) || 'cute-beige';
    document.documentElement.setAttribute('data-theme', saved);
    var dot = document.querySelector('.theme-preview-dot');
    if (dot) { dot.style.background = COLORS[saved] || COLORS['cute-beige']; }
  }
  toggle && toggle.addEventListener('click', function() {
    var open = menu.classList.toggle('hidden') === false;
    toggle.setAttribute('aria-expanded', open);
  });
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.theme-switcher')) {
      menu.classList.add('hidden');
      toggle && toggle.setAttribute('aria-expanded', 'false');
    }
  });
  menu && menu.querySelectorAll('.theme-option').forEach(function(btn) {
    btn.addEventListener('click', function() { applyTheme(btn.dataset.theme); });
  });
  init();
})();
</script>
