<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Artist Store{% endblock %}</title>
    {% load static %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="{% static 'store/css/themes.css' %}" rel="stylesheet">
    <link href="{% static 'store/css/output.css' %}" rel="stylesheet">
    <link href="{% static 'store/css/artisan.css' %}" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col md:flex-row" style="background: var(--theme-bg); color: var(--theme-text);">

    {# ── Mobile header ── #}
    <header class="mobile-header md:hidden flex items-center justify-between px-5 py-3.5 shrink-0 border-b" style="background: var(--theme-bg-header); border-color: var(--theme-border); backdrop-filter: blur(12px);">
        <span class="mobile-header-title">{{ site_settings.site_name|default:"Artist Store" }}</span>
        <button type="button" id="sidebar-toggle" class="p-2 rounded-lg touch-manipulation" style="color: var(--theme-text); -webkit-tap-highlight-color: transparent;" aria-label="Toggle menu">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
    </header>

    {# ── Sidebar ── #}
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 -translate-x-full md:translate-x-0 md:relative md:inset-auto shrink-0 border-r flex flex-col transition-transform duration-200 ease-out" style="background: var(--theme-bg-header); border-color: var(--theme-border); top: 0; padding-top: env(safe-area-inset-top, 0);">
        <div class="md:hidden flex justify-end p-3">
            <button type="button" id="sidebar-close" class="p-2 rounded-lg" style="color: var(--theme-text);" aria-label="Close menu">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        {% include "store/components/organisms/nav_bar.html" %}
    </aside>

    <div id="sidebar-backdrop" class="fixed inset-0 z-30 bg-black/30 hidden md:hidden" aria-hidden="true" style="backdrop-filter: blur(2px);"></div>

    <main class="flex-1 min-w-0 overflow-auto w-full">
        {% block content %}{% endblock %}
    </main>

    <script>
      (function() {
        var saved = localStorage.getItem('artist-store-theme');
        var defaultTheme = '{{ site_settings.default_theme|default:"cute-beige" }}';
        document.documentElement.setAttribute('data-theme', saved || defaultTheme);
      })();
      (function() {
        var sidebar = document.getElementById('sidebar');
        var toggle = document.getElementById('sidebar-toggle');
        var closeBtn = document.getElementById('sidebar-close');
        var backdrop = document.getElementById('sidebar-backdrop');
        if (!sidebar || !toggle) return;
        function openSidebar() {
          sidebar.classList.remove('-translate-x-full');
          if (backdrop) backdrop.classList.remove('hidden');
          document.body.style.overflow = 'hidden';
        }
        function closeSidebar() {
          sidebar.classList.add('-translate-x-full');
          if (backdrop) backdrop.classList.add('hidden');
          document.body.style.overflow = '';
        }
        toggle.addEventListener('click', openSidebar);
        if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
        if (backdrop) backdrop.addEventListener('click', closeSidebar);
      })();
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
